<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFT Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <article class="card">
      <div class="card__image">
        <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT">
        <div class="card__overlay">
          <img src="images/icon-view.svg" alt="">
        </div>
      </div>
      <h1 class="card__title">Equilibrium #3429</h1>
      <p class="card__text">Our Equilibrium collection promotes balance and calm.</p>
      <div class="card__info">
        <span class="card__price"><img src="images/icon-ethereum.svg" alt=""> 0.041 ETH</span>
        <span class="card__time"><img src="images/icon-clock.svg" alt=""> 3 days left</span>
      </div>
      <hr>
      <div class="card__author">
        <img src="images/image-avatar.png" alt="Jules Wyvern">
        <p>Creation of <a href="#">Jules Wyvern</a></p>
      </div>
    </article>
  </main>
</body>
</html>
